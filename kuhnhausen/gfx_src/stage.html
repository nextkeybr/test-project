<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/base.css">
<link rel="stylesheet" href="node_modules/@fontsource/nanum-pen-script/index.css">
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="lib/kit.js"></script>
<script src="lib/evcard.js"></script>
<script src="lib/scenes.js"></script>
<script src="data/oregon.js"></script>
<script src="templates/t01_transcript.js"></script>
<script src="templates/t02_floorplan.js"></script>
<script src="templates/t03_hammer.js"></script>
<script src="templates/t04_board.js"></script>
<script src="templates/t06_person.js"></script>
<script src="templates/t07_info.js"></script>
<script src="templates/t08_emphasis.js"></script>
<script src="templates/t09_doc.js"></script>
<script src="templates/t10_quote.js"></script>
<script src="templates/t11_map.js"></script>
<script src="templates/t12_timeline.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
  // ?clip=B04 → clips/B04.js 를 불러와 window.__seek(t) 로 프레임 단위 제어
  const id = new URLSearchParams(location.search).get("clip");
  const s = document.createElement("script");
  s.src = `clips/${id}.js`;
  s.onload = async () => {
    await document.fonts.load('700 44px "Pretendard"');
    await document.fonts.load('800 44px "Pretendard"');
    if (CLIP.hand) await document.fonts.load('400 72px "Nanum Pen Script"', CLIP.hand);
    await document.fonts.ready;
    const stage = document.getElementById("stage");
    if (CLIP.format === "full") stage.classList.add("full");
    const tl = gsap.timeline({ paused: true });
    const onFrame = CLIP.build(stage, tl) || (() => {});
    window.__seek = (t) => { tl.seek(t, false); onFrame(t); };
    window.__clip = { file: CLIP.file, format: CLIP.format, duration: CLIP.duration, holdFrom: CLIP.holdFrom ?? null };
    window.__seek(0);
    window.__ready = true;
  };
  document.head.appendChild(s);
</script>
</body>
</html>
