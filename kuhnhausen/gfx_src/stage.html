<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/base.css">
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="templates/t01_transcript.js"></script>
<script src="templates/t08_emphasis.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
  // ?clip=B04 → clips/B04.js 를 불러와 window.__seek(t) 로 프레임 단위 제어
  const id = new URLSearchParams(location.search).get("clip");
  const s = document.createElement("script");
  s.src = `clips/${id}.js`;
  s.onload = async () => {
    await document.fonts.load('700 44px "Pretendard"');
    await document.fonts.load('800 44px "Pretendard"');
    await document.fonts.ready;
    const stage = document.getElementById("stage");
    if (CLIP.format === "full") stage.classList.add("full");
    const tl = gsap.timeline({ paused: true });
    const onFrame = CLIP.build(stage, tl) || (() => {});
    window.__seek = (t) => { tl.seek(t, false); onFrame(t); };
    window.__clip = { file: CLIP.file, format: CLIP.format, duration: CLIP.duration };
    window.__seek(0);
    window.__ready = true;
  };
  document.head.appendChild(s);
</script>
</body>
</html>
